name: Atualizar agenda anônima
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: anonymous-agenda-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_AUTOMATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Restaurar somente o token cifrado
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .private/token.bin
          key: agenda-token-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: agenda-token-v1-
      - name: Gerar somente dados anônimos
        id: generate
        run: npm run generate
        env:
          FOREASY_EMAIL: ${{ secrets.FOREASY_EMAIL }}
          FOREASY_PASSWORD: ${{ secrets.FOREASY_PASSWORD }}
          FOREASY_TOKEN_KEY: ${{ secrets.FOREASY_TOKEN_KEY }}
          FOREASY_BUILDING_ID: ${{ secrets.FOREASY_BUILDING_ID }}
          FOREASY_MACHINE_CONFIG: ${{ secrets.FOREASY_MACHINE_CONFIG }}
          FOREASY_CONTRACT: ${{ vars.FOREASY_CONTRACT || 'unverified' }}
          FOREASY_MAX_CALLS: ${{ vars.FOREASY_MAX_CALLS || '40' }}
          FOREASY_PROBE_DATE_OFFSET: ${{ vars.FOREASY_PROBE_DATE_OFFSET || '0' }}
          FOREASY_PROBE_TIME: ${{ vars.FOREASY_PROBE_TIME }}
      - name: Preservar token cifrado inclusive se a coleta falhar
        if: always() && steps.generate.outcome != 'skipped' && hashFiles('.private/token.bin') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .private/token.bin
          key: agenda-token-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configurar caminho público
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Bloquear publicação de campos privados
        run: npm run audit
        env:
          FOREASY_EMAIL: ${{ secrets.FOREASY_EMAIL }}
          FOREASY_PASSWORD: ${{ secrets.FOREASY_PASSWORD }}
          FOREASY_TOKEN_KEY: ${{ secrets.FOREASY_TOKEN_KEY }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
          retention-days: 1
      - name: Remover estado local
        if: always()
        run: rm -rf .private
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
