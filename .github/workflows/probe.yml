name: Validar conexão Foreasy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anonymous-agenda-production
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Diagnóstico somente leitura
        run: node --import tsx scripts/run-probe.ts
        env:
          FOREASY_EMAIL: ${{ secrets.FOREASY_EMAIL }}
          FOREASY_PASSWORD: ${{ secrets.FOREASY_PASSWORD }}
          FOREASY_BUILDING_ID: ${{ secrets.FOREASY_BUILDING_ID }}
